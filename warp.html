<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Warp Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }


    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(
            100,
            window.innerWidth / window.innerHeight,
            0.1,
            200
        );
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ 
            canvas,
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Star field setup
        const COUNT = 400;
        let instancedMesh;
        
        function createStarField() {
            if (instancedMesh) {
                scene.remove(instancedMesh);
                instancedMesh.geometry.dispose();
                instancedMesh.material.dispose();
            }
            
            const geometry = new THREE.SphereGeometry(0.05, 8, 8);
            const material = new THREE.MeshBasicMaterial({ 
                color: new THREE.Color(1.5, 1.5, 1.5),
                toneMapped: false
            });
            
            instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
            
            // Initialize positions
            const temp = new THREE.Object3D();
            for (let i = 0; i < COUNT; i++) {
                temp.position.x = (Math.random() - 0.5) * 10;
                temp.position.y = (Math.random() - 0.5) * 10;
                temp.position.z = (Math.random() - 0.5) * 20;
                temp.updateMatrix();
                instancedMesh.setMatrixAt(i, temp.matrix);
            }
            
            instancedMesh.instanceMatrix.needsUpdate = true;
            scene.add(instancedMesh);
        }
        
        createStarField();
        
        // Animation variables
        const clock = new THREE.Clock();
        const tempMatrix = new THREE.Matrix4();
        const tempPosition = new THREE.Vector3();
        const tempObject = new THREE.Object3D();
        const tempColor = new THREE.Color();
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            const delta = clock.getDelta();
            
            if (!instancedMesh) return;
            
            for (let i = 0; i < COUNT; i++) {
                instancedMesh.getMatrixAt(i, tempMatrix);
                tempPosition.setFromMatrixPosition(tempMatrix);
                
                // Update position (z-axis movement with deceleration)
                if (tempPosition.z > 10) {
                    tempPosition.z = -10;
                } else {
                    // Smoothly decelerate to a minimum speed instead of stopping
                    const minSpeed = 0.02;
                    const maxSpeed = 5.0;
                    const decayFactor = 0.3;
                    const velocity = minSpeed + (maxSpeed - minSpeed) * Math.exp(-decayFactor * elapsedTime);
                    tempPosition.z += velocity * delta;
                }
                
                // Update scale (warp effect)
                const scaleZ = Math.max(1, Math.pow(0.5, elapsedTime) * 10);
                tempObject.scale.set(1, 1, scaleZ);
                tempObject.position.copy(tempPosition);
                tempObject.updateMatrix();
                
                instancedMesh.setMatrixAt(i, tempObject.matrix);
                
                // Update color (fade effect)
                if (tempPosition.z > 0) {
                    tempColor.setRGB(1, 1, 1);
                } else {
                    const fade = 1 - tempPosition.z / -10;
                    tempColor.setRGB(fade, fade, fade);
                }
                instancedMesh.setColorAt(i, tempColor);
            }
            
            instancedMesh.instanceMatrix.needsUpdate = true;
            if (instancedMesh.instanceColor) {
                instancedMesh.instanceColor.needsUpdate = true;
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Controls
        const countSlider = document.getElementById('countSlider');
        const countValue = document.getElementById('countValue');
        
        countSlider.addEventListener('input', (e) => {
            COUNT = parseInt(e.target.value);
            countValue.textContent = COUNT;
            createStarField();
        });
    </script>
</body>
</html>
