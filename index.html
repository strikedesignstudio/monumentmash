<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monument Mashup</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            z-index: 5;
        }
        .space-bg {
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at bottom, #639ed5 0%, #acdef6 100%);
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .clouds-overlay {
            z-index: 10;
            opacity: .3;
            filter: blur(20px);
            pointer-events: none;
            object-fit: cover;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        #scene-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="space-bg"></div>
    <div id="scene-layer"></div>
    <img class="clouds-overlay" src="cloudtop.gif" onerror="this.style.display='none'">

    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
// --- SCENE SETUP ---
const scene = new THREE.Scene();
const sceneLayer = document.getElementById('scene-layer');
const camera = new THREE.PerspectiveCamera(70, sceneLayer.clientWidth / sceneLayer.clientHeight, 0.01, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0); // Transparent background
renderer.setSize(sceneLayer.clientWidth, sceneLayer.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
sceneLayer.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enabled = false; // Disable orbit controls to fix the scene

// --- LIGHTS ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
hemiLight.position.set(0, 2, 0);
scene.add(hemiLight);

// Soft rainbow lighting
const rainbowLights = [];
const rainbowColors = [0xff6b6b, 0xffd93d, 0x6bcf7f, 0x4d96ff, 0xc77dff, 0xff6bda];
rainbowColors.forEach((color, i) => {
    const light = new THREE.PointLight(color, 0.4, 100);
    const angle = (i / rainbowColors.length) * Math.PI * 2;
    light.position.set(Math.cos(angle) * 15, Math.sin(angle) * 15, -10);
    scene.add(light);
    rainbowLights.push({ light, angle, radius: 15, speed: 0.001 + i * 0.0002 });
});

// --- GLOBAL VARIABLES ---
const clickableObjects = [];
const hoverableObjects = [];
const warpingMeshes = []; // For floating effect
let INTERSECTED;
const loadingText = document.getElementById('loading');

// --- AUDIO SETUP ---
const listener = new THREE.AudioListener();
camera.add(listener);
const audioLoader = new THREE.AudioLoader();
let audioBufferShared = null;
let currentSource = null;

// --- AUDIO SEGMENTS (seconds) ---
const audioSegments = {
    "Hilmi": 6,
    "Anon": 66,
    "Henry": 85.2,
    "Sabir": 120.6,
    "Shemi": 137.4,
    "Hannah": 187.2,
    "Evodie": 240,
    "Marvin": 270,
    "Jessica": 327,
    "Rachid": 444.6,
    "Jermaine": 557.4,
    "Dominic": 614.4
};

// --- HOVER COLORS ---
const hoverColorMap = {
    "Hilmi": 0xff0000,
    "Anon": 0x00ff00,
    "Henry": 0x0000ff,
    "Sabir": 0xffff00,
    "Shemi": 0xff00ff,
    "Hannah": 0x00ffff,
    "Evodie": 0xff8800,
    "Marvin": 0x88ff00,
    "Jessica": 0x0088ff,
    "Rachid": 0x8800ff,
    "Jermaine": 0xff0088,
    "Dominic": 0x00ff88
};

// --- LOAD AUDIO ---
audioLoader.load('audio/monmashcomp.mp3', function (buffer) {
    audioBufferShared = buffer;
});

// --- LOAD GLTF MODEL ---
const loader = new THREE.GLTFLoader();
loader.load(
    'model/modelfull2.gltf',
    function (gltf) {
        if (!gltf || !gltf.scene) {
            console.error('GLTF file did not load properly:', gltf);
            return;
        }

        const model = gltf.scene;
        model.scale.set(0.026, 0.026, 0.026);
        model.position.set(0, -2.5, -5); // Push model far into the distance

        const meshesToRemove = ["Mesh040", "Final_Model_bottom_to_building"];
        const toRemove = [];

        // --- Collect unwanted meshes (including their children) ---
        model.traverse((child) => {
            if (meshesToRemove.includes(child.name)) {
                toRemove.push(child);
            }
        });

        // --- Remove unwanted meshes & descendants safely ---
        toRemove.forEach((mesh) => {
            mesh.traverse((descendant) => {
                if (descendant.isMesh) {
                    descendant.geometry.dispose();
                    if (descendant.material) {
                        if (Array.isArray(descendant.material)) {
                            descendant.material.forEach((m) => m.dispose());
                        } else {
                            descendant.material.dispose();
                        }
                    }
                }
            });
            if (mesh.parent) mesh.parent.remove(mesh);
        });

        // --- Populate clickable & hoverable objects ---
        model.traverse((child) => {
            if (child.isMesh && !meshesToRemove.includes(child.name)) {
                clickableObjects.push(child);
                child.material.transparent = true;
                
                if (Object.keys(hoverColorMap).includes(child.name)) {
                    hoverableObjects.push(child);
                    
                    // Setup for random floating effect around center
                    warpingMeshes.push(child);
                    child.userData.originalPosition = child.position.clone();
                    
                    // Random starting position around the center model
                    const radius = 9 + Math.random() * 15; // Distance from center (3x larger)
                    const theta = Math.random() * Math.PI * 2; // Random angle around Y axis
                    const phi = Math.random() * Math.PI; // Random vertical angle
                    
                    child.position.x = radius * Math.sin(phi) * Math.cos(theta);
                    child.position.y = radius * Math.sin(phi) * Math.sin(theta) - 2.5;
                    child.position.z = radius * Math.cos(phi) - 5;
                    
                    // Random drift velocities for organic floating
                    child.userData.velocityX = (Math.random() - 0.5) * 0.02;
                    child.userData.velocityY = (Math.random() - 0.5) * 0.02;
                    child.userData.velocityZ = (Math.random() - 0.5) * 0.02;
                    
                    // Rotation for added visual interest
                    child.userData.rotationSpeed = {
                        x: (Math.random() - 0.5) * 0.01,
                        y: (Math.random() - 0.5) * 0.01,
                        z: (Math.random() - 0.5) * 0.01
                    };
                }
            }
        });

        scene.add(model);
        if (loadingText) loadingText.remove();
    },
    function (xhr) {
        if (xhr.total && loadingText) {
            loadingText.innerText = `Loading... ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
        }
    },
    function (error) {
        console.error('GLTF load error:', error);
    }
);

// --- RAYCASTING ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// --- PLAY AUDIO SEGMENTS ---
function playFrom(startTime) {
    if (!audioBufferShared) return;
    if (currentSource) currentSource.stop();
    const audioCtx = listener.context;
    const source = audioCtx.createBufferSource();
    source.buffer = audioBufferShared;
    source.connect(listener.getInput());
    source.start(0, startTime);
    currentSource = source;
}

// --- CLICK EVENTS ---
function onClick(event) {
    const rect = sceneLayer.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects, true);

    if (intersects.length > 0) {
        const clicked = intersects[0].object;
        if (clicked.material && clicked.material.opacity !== undefined) {
            clicked.material.opacity = 0.6;
            setTimeout(() => (clicked.material.opacity = 1), 300);
        }
        const segmentStart = audioSegments[clicked.name];
        if (segmentStart !== undefined) playFrom(segmentStart);
    }
}

// --- HOVER EVENTS (colors only) ---
function onMouseMove(event) {
    const rect = sceneLayer.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(hoverableObjects, true);

    if (intersects.length > 0) {
        const hovered = intersects[0].object;
        if (INTERSECTED !== hovered) {
            if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
            INTERSECTED = hovered;
            if (!INTERSECTED.originalColor) INTERSECTED.originalColor = INTERSECTED.material.color.clone();
            const colorHex = hoverColorMap[INTERSECTED.name] || 0xffff00;
            INTERSECTED.targetColor = new THREE.Color(colorHex);
        }
    } else {
        if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
        INTERSECTED = null;
    }
}

sceneLayer.addEventListener("mousemove", onMouseMove);
sceneLayer.addEventListener("click", onClick);

// --- RESIZE HANDLER ---
window.addEventListener("resize", function () {
    camera.aspect = sceneLayer.clientWidth / sceneLayer.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneLayer.clientWidth, sceneLayer.clientHeight);
});

// --- ANIMATE LOOP ---
function animate() {
    requestAnimationFrame(animate);

    // Hover color transitions
    hoverableObjects.forEach((obj) => {
        if (obj.material && obj.material.color && obj.targetColor) {
            obj.material.color.lerp(obj.targetColor, 0.1);
        }
    });

    // Random floating effect - meshes drift around the center model
    warpingMeshes.forEach((mesh) => {
        // Update position based on velocity
        mesh.position.x += mesh.userData.velocityX;
        mesh.position.y += mesh.userData.velocityY;
        mesh.position.z += mesh.userData.velocityZ;
        
        // Add subtle rotation
        mesh.rotation.x += mesh.userData.rotationSpeed.x;
        mesh.rotation.y += mesh.userData.rotationSpeed.y;
        mesh.rotation.z += mesh.userData.rotationSpeed.z;

        // Calculate distance from center point (0, -2.5, -5)
        const centerX = 0, centerY = -2.5, centerZ = -5;
        const dx = mesh.position.x - centerX;
        const dy = mesh.position.y - centerY;
        const dz = mesh.position.z - centerZ;
        const distanceFromCenter = Math.sqrt(dx * dx + dy * dy + dz * dz);

        // Keep meshes within a spherical boundary (radius 24 - 3x larger)
        const maxRadius = 24;
        if (distanceFromCenter > maxRadius) {
            // Bounce back toward center with some randomness
            mesh.userData.velocityX = -mesh.userData.velocityX * 0.8 + (Math.random() - 0.5) * 0.01;
            mesh.userData.velocityY = -mesh.userData.velocityY * 0.8 + (Math.random() - 0.5) * 0.01;
            mesh.userData.velocityZ = -mesh.userData.velocityZ * 0.8 + (Math.random() - 0.5) * 0.01;
        }
        
        // Occasionally add random impulses for more organic movement
        if (Math.random() < 0.01) {
            mesh.userData.velocityX += (Math.random() - 0.5) * 0.005;
            mesh.userData.velocityY += (Math.random() - 0.5) * 0.005;
            mesh.userData.velocityZ += (Math.random() - 0.5) * 0.005;
        }
    });

    // Animate rainbow lights in slow orbit
    rainbowLights.forEach((item) => {
        item.angle += item.speed;
        item.light.position.x = Math.cos(item.angle) * item.radius;
        item.light.position.y = Math.sin(item.angle) * item.radius;
    });

    renderer.render(scene, camera);
}
animate();
    </script>

    <script>
        const space = document.querySelector('.space-bg');
        const numStars = 200;
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            star.style.animationDuration = `${2 + Math.random() * 3}s`;
            space.appendChild(star);
        }
    </script>
</body>
</html>
