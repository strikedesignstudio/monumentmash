<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monument Mashup</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; z-index: 5;}

    .space-bg {
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #c9e4f7 0%, #1a2a4a 100%);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .clouds-overlay {
      z-index: 10;
      opacity: .3;
      filter: blur(20px);
      pointer-events: none;
      object-fit: cover;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #scene-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="space-bg"></div>

<div id="scene-layer"></div>

<img class="clouds-overlay" src="cloudtop.gif" onerror="this.style.display='none'">

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>

 <script>
  // --- SCENE SETUP ---
  const scene = new THREE.Scene();

  // --- CONTAINER & RENDERER ---
  const container = document.getElementById('scene-layer');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0); // transparent background
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  // --- CAMERA ---
  const camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.01, 1000);
  camera.position.set(0, 0, 5);

  // --- CONTROLS ---
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // --- LIGHTS ---
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 2, 0);
  scene.add(hemiLight);

  // --- GLOBAL VARIABLES ---
  const clickableObjects = [];
  const hoverableObjects = [];
  let INTERSECTED;
  const loadingText = document.getElementById('loading');

  // --- AUDIO SETUP ---
  const listener = new THREE.AudioListener();
  camera.add(listener);
  const audioLoader = new THREE.AudioLoader();
  let audioBufferShared = null;
  let currentSource = null;

  // --- AUDIO SEGMENTS ---
  const audioSegments = {
    "Hilmi": 6, "Anon": 66, "Henry": 85.2, "Sabir": 120.6, "Shemi": 137.4,
    "Hannah": 187.2, "Evodie": 240, "Marvin": 270, "Jessica": 327,
    "Rachid": 444.6, "Jermaine": 557.4, "Dominic": 614.4
  };

  // --- HOVER COLORS ---
  const hoverColorMap = {
    "Hilmi": 0xff0000, "Anon": 0x00ff00, "Henry": 0x0000ff, "Sabir": 0xffff00,
    "Shemi": 0xff00ff, "Hannah": 0x00ffff, "Evodie": 0xff8800, "Marvin": 0x88ff00,
    "Jessica": 0x0088ff, "Rachid": 0x8800ff, "Jermaine": 0xff0088, "Dominic": 0x00ff88
  };

  // --- LOAD AUDIO ---
  audioLoader.load('audio/monmashcomp.mp3', function (buffer) {
    audioBufferShared = buffer;
  });

  // --- GLTF LOADER ---
  const loader = new THREE.GLTFLoader();

  const vortexLabels = ["Hilmi","Anon","Henry","Sabir","Shemi","Hannah","Evodie","Marvin","Jessica","Rachid","Jermaine","Dominic"];
  const vortexMeshes = [];
  const vortexParams = [];

  loader.load(
    'model/modelfull2.gltf',
    function (gltf) {
      const model = gltf.scene;
      model.scale.set(0.026, 0.026, 0.026);
      model.position.y -= 2.5;

      const meshesToRemove = ["Mesh040", "Final_Model_bottom_to_building"];
      const toRemove = [];

      model.traverse((child) => {
        if (meshesToRemove.includes(child.name)) toRemove.push(child);
      });

      toRemove.forEach((mesh) => {
        mesh.traverse((descendant) => {
          if (descendant.isMesh) {
            descendant.geometry.dispose();
            if (descendant.material) {
              if (Array.isArray(descendant.material)) {
                descendant.material.forEach((m) => m.dispose());
              } else {
                descendant.material.dispose();
              }
            }
          }
        });
        if (mesh.parent) mesh.parent.remove(mesh);
      });

      // --- Populate clickable, hoverable, and vortex meshes ---
      model.traverse((child) => {
        if (child.isMesh && !meshesToRemove.includes(child.name)) {
          clickableObjects.push(child);
          child.material.transparent = true;

          if (Object.keys(hoverColorMap).includes(child.name)) {
            hoverableObjects.push(child);
          }

          if (vortexLabels.includes(child.name)) {
            vortexMeshes.push(child);
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 0.5 + 0.1;
            const speed = 0.002 + Math.random() * 0.004;

            vortexParams.push({
              angle,
              radius: distance,
              speed,
              scale: child.scale.x
            });

            child.position.set(Math.cos(angle) * distance, Math.sin(angle) * distance, 0);
          }
        }
      });

      scene.add(model);

      if (loadingText) loadingText.remove();
    },
    function (xhr) {
      if (xhr.total && loadingText) {
        loadingText.innerText = `Loading... ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
      }
    },
    function (error) {
      console.error('GLTF load error:', error);
    }
  );

  // --- RAYCASTING ---
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  // --- PLAY AUDIO SEGMENTS ---
  function playFrom(startTime) {
    if (!audioBufferShared) return;
    if (currentSource) currentSource.stop();

    const audioCtx = listener.context;
    const source = audioCtx.createBufferSource();
    source.buffer = audioBufferShared;
    source.connect(listener.getInput());
    source.start(0, startTime);
    currentSource = source;
  }

  // --- CLICK EVENTS ---
  function onClick(event) {
    mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
    mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(clickableObjects, true);
    if (intersects.length > 0) {
      const clicked = intersects[0].object;

      if (clicked.material && clicked.material.opacity !== undefined) {
        clicked.material.opacity = 0.6;
        setTimeout(() => (clicked.material.opacity = 1), 300);
      }

      const segmentStart = audioSegments[clicked.name];
      if (segmentStart !== undefined) playFrom(segmentStart);
    }
  }

  // --- HOVER EVENTS ---
  function onMouseMove(event) {
    mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
    mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(hoverableObjects, true);

    if (intersects.length > 0) {
      const hovered = intersects[0].object;

      if (INTERSECTED !== hovered) {
        if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;

        INTERSECTED = hovered;
        if (!INTERSECTED.originalColor)
          INTERSECTED.originalColor = INTERSECTED.material.color.clone();

        const colorHex = hoverColorMap[INTERSECTED.name] || 0xffff00;
        INTERSECTED.targetColor = new THREE.Color(colorHex);
      }
    } else {
      if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
      INTERSECTED = null;
    }
  }

  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("click", onClick);

  // --- RESIZE HANDLER ---
  window.addEventListener("resize", function () {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  // --- ANIMATE LOOP ---
  function animate() {
    requestAnimationFrame(animate);
    controls.update();

    hoverableObjects.forEach((obj) => {
      if (obj.material && obj.material.color && obj.targetColor) {
        obj.material.color.lerp(obj.targetColor, 0.1);
      }
    });

    // Vortex animation
    vortexMeshes.forEach((mesh, i) => {
      const params = vortexParams[i];
      params.radius += params.speed;
      mesh.position.x = Math.cos(params.angle) * params.radius;
      mesh.position.y = Math.sin(params.angle) * params.radius;
      mesh.scale.set(params.scale * (1 + params.radius * 2),
                     params.scale * (1 + params.radius * 2),
                     params.scale * (1 + params.radius * 2));

      if (params.radius > 2.5) {
        params.radius = 0;
        params.angle = Math.random() * Math.PI * 2;
      }
    });

    renderer.render(scene, camera);
  }
  animate();
</script>
<script>
const space = document.querySelector('.space-bg');
const numStars = 200;

for (let i = 0; i < numStars; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  star.style.top = `${Math.random() * 100}%`;
  star.style.left = `${Math.random() * 100}%`;

  const size = Math.random() * 2 + 1;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;

  star.style.animationDelay = `${Math.random() * 5}s`;
  star.style.animationDuration = `${2 + Math.random() * 3}s`;

  space.appendChild(star);
}
</script>

</body>
</html>
