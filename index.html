<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monument Mashup</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; z-index: 5;}

    .space-bg {
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #c9e4f7 0%, #1a2a4a 100%);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .clouds-overlay {
      z-index: 10;
      opacity: .3;
      filter: blur(20px);
      pointer-events: none;
      object-fit: cover;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #scene-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="space-bg"></div>

<div id="scene-layer"></div>

<img class="clouds-overlay" src="cloudtop.gif" onerror="this.style.display='none'">

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>

 <script>
/* =========================
   SCENE SETUP
========================= */
const scene = new THREE.Scene();
const sceneLayer = document.getElementById('scene-layer');

const camera = new THREE.PerspectiveCamera(
  70,
  sceneLayer.clientWidth / sceneLayer.clientHeight,
  0.01,
  1000
);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(sceneLayer.clientWidth, sceneLayer.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
sceneLayer.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* =========================
   LIGHTS
========================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.2));

/* =========================
   GLOBALS
========================= */
const clickableObjects = [];
const hoverableObjects = [];
let INTERSECTED = null;

/* =========================
   PLANET / VORTEX SETUP
========================= */
const planetNames = [
  "Hilmi","Anon","Henry","Sabir","Shemi","Hannah",
  "Evodie","Marvin","Jessica","Rachid","Jermaine","Dominic"
];

const planets = [];

/* =========================
   AUDIO
========================= */
const listener = new THREE.AudioListener();
camera.add(listener);

const audioLoader = new THREE.AudioLoader();
let audioBufferShared = null;
let currentSource = null;

const audioSegments = {
  Hilmi: 6,
  Anon: 66,
  Henry: 85.2,
  Sabir: 120.6,
  Shemi: 137.4,
  Hannah: 187.2,
  Evodie: 240,
  Marvin: 270,
  Jessica: 327,
  Rachid: 444.6,
  Jermaine: 557.4,
  Dominic: 614.4
};

audioLoader.load("audio/monmashcomp.mp3", buffer => {
  audioBufferShared = buffer;
});

function playFrom(startTime) {
  if (!audioBufferShared) return;
  if (currentSource) currentSource.stop();

  const source = listener.context.createBufferSource();
  source.buffer = audioBufferShared;
  source.connect(listener.getInput());
  source.start(0, startTime);
  currentSource = source;
}

/* =========================
   HOVER COLORS
========================= */
const hoverColorMap = {
  Hilmi: 0xff0000,
  Anon: 0x00ff00,
  Henry: 0x0000ff,
  Sabir: 0xffff00,
  Shemi: 0xff00ff,
  Hannah: 0x00ffff,
  Evodie: 0xff8800,
  Marvin: 0x88ff00,
  Jessica: 0x0088ff,
  Rachid: 0x8800ff,
  Jermaine: 0xff0088,
  Dominic: 0x00ff88
};

/* =========================
   LOAD MODEL
========================= */
const loader = new THREE.GLTFLoader();
loader.load("model/modelfull2.gltf", gltf => {
  const model = gltf.scene;
  model.scale.set(0.026, 0.026, 0.026);
  model.position.y -= 2.5;

  model.traverse(child => {
    if (!child.isMesh) return;

    clickableObjects.push(child);
    child.material.transparent = true;

    if (planetNames.includes(child.name)) {
      hoverableObjects.push(child);

      planets.push({
        mesh: child,
        angle: Math.random() * Math.PI * 2,
        radius: 2 + Math.random() * 5,
        height: (Math.random() - 0.5) * 2,
        speed: 0.002 + Math.random() * 0.003,
        drift: 0.03 + Math.random() * 0.04
      });
    }
  });

  scene.add(model);
});

/* =========================
   RAYCASTING
========================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onClick(e) {
  const r = sceneLayer.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, true);

  if (hits.length) {
    const obj = hits[0].object;
    obj.material.opacity = 0.6;
    setTimeout(() => obj.material.opacity = 1, 300);

    if (audioSegments[obj.name] !== undefined) {
      playFrom(audioSegments[obj.name]);
    }
  }
}

function onMove(e) {
  const r = sceneLayer.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hoverableObjects, true);

  if (hits.length) {
    const obj = hits[0].object;
    if (INTERSECTED !== obj) {
      if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
      INTERSECTED = obj;
      if (!obj.originalColor) obj.originalColor = obj.material.color.clone();
      obj.targetColor = new THREE.Color(hoverColorMap[obj.name]);
    }
  } else {
    if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
    INTERSECTED = null;
  }
}

sceneLayer.addEventListener("click", onClick);
sceneLayer.addEventListener("mousemove", onMove);

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", () => {
  camera.aspect = sceneLayer.clientWidth / sceneLayer.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(sceneLayer.clientWidth, sceneLayer.clientHeight);
});

/* =========================
   ANIMATION LOOP
========================= */
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // VORTEX MOTION
  planets.forEach(p => {
    p.angle += p.speed;

    p.mesh.position.x = Math.cos(p.angle) * p.radius;
    p.mesh.position.y = p.height + Math.sin(p.angle * 0.5);
    p.mesh.position.z += p.drift;

    if (p.mesh.position.z > camera.position.z + 1) {
      p.mesh.position.z = -25;
      p.radius = 2 + Math.random() * 5;
      p.height = (Math.random() - 0.5) * 2;
    }

    p.mesh.rotation.y += 0.004;
  });

  // HOVER COLOR LERP
  hoverableObjects.forEach(o => {
    if (o.targetColor) o.material.color.lerp(o.targetColor, 0.1);
  });

  renderer.render(scene, camera);
}

animate();
</script>


<script>
const space2 = document.querySelector('.space-bg');
const numStars2 = 200;

for (let i = 0; i < numStars2; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  star.style.top = `${Math.random() * 100}%`;
  star.style.left = `${Math.random() * 100}%`;

  const size = Math.random() * 2 + 1;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;

  star.style.animationDelay = `${Math.random() * 5}s`;
  star.style.animationDuration = `${2 + Math.random() * 3}s`;

  space2.appendChild(star);
}
</script>

</body>
</html>
