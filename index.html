<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monument Mashup</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; z-index: 5;}

    .space-bg {
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #0d0607 0%, #200c0f 100%);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .clouds-overlay {
      z-index: 10;
      opacity: .3;
      filter: blur(20px);
      pointer-events: none;
      object-fit: cover;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #scene-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="space-bg"></div>

<div id="scene-layer"></div>

<img class="clouds-overlay" src="cloudtop.gif" onerror="this.style.display='none'">

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
  // --- SCENE SETUP ---
  const scene = new THREE.Scene();
  scene.background = null; // Transparent background
  scene.fog = new THREE.FogExp2(0x000000, 0.01);

  const container = document.getElementById('scene-layer');
  const camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.01, 1000);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // --- LIGHTS ---
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 2, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 5, 5);
  scene.add(dirLight);

  // --- GLOBAL VARIABLES ---
  const clickableObjects = [];
  const hoverableObjects = [];
  const tunnelMeshes = [];
  let INTERSECTED;

  // --- AUDIO SETUP ---
  const listener = new THREE.AudioListener();
  camera.add(listener);
  const audioLoader = new THREE.AudioLoader();
  let audioBufferShared = null;
  let currentSource = null;

  const audioSegments = {
    "Hilmi": 6, "Anon": 66, "Henry": 85.2, "Sabir": 120.6,
    "Shemi": 137.4, "Hannah": 187.2, "Evodie": 240, "Marvin": 270,
    "Jessica": 327, "Rachid": 444.6, "Jermaine": 557.4, "Dominic": 614.4
  };

  const hoverColorMap = {
    "Hilmi": 0xff0000, "Anon": 0x00ff00, "Henry": 0x0000ff, "Sabir": 0xffff00,
    "Shemi": 0xff00ff, "Hannah": 0x00ffff, "Evodie": 0xff8800, "Marvin": 0x88ff00,
    "Jessica": 0x0088ff, "Rachid": 0x8800ff, "Jermaine": 0xff0088, "Dominic": 0x00ff88
  };

  // --- LOAD AUDIO ---
  audioLoader.load('audio/monmashcomp.mp3', function(buffer) {
    audioBufferShared = buffer;
    console.log('Audio loaded successfully');
  }, undefined, function(error) {
    console.log('Audio failed to load:', error);
  });

  // --- LOAD GLTF MODEL ---
  const loader = new THREE.GLTFLoader();
  loader.load('model/modelfull2.gltf', function(gltf) {
    if (!gltf || !gltf.scene) return;
    const model = gltf.scene;
    model.scale.set(0.026, 0.026, 0.026);
    model.position.y -= 2.5;

    const meshesToRemove = ["Mesh040", "Final_Model_bottom_to_building"];
    const toRemove = [];

    model.traverse((child) => {
      if (meshesToRemove.includes(child.name)) toRemove.push(child);
    });

    toRemove.forEach(mesh => {
      mesh.traverse((descendant) => {
        if (descendant.isMesh) {
          descendant.geometry.dispose();
          if (descendant.material) {
            if (Array.isArray(descendant.material)) descendant.material.forEach(m => m.dispose());
            else descendant.material.dispose();
          }
        }
      });
      if (mesh.parent) mesh.parent.remove(mesh);
    });

    // --- Populate clickable + hover + tunnel meshes (ALL as planets) ---
    let meshIndex = 0;
    const audioMeshNames = Object.keys(audioSegments);
    
    model.traverse((child) => {
      if (child.isMesh && !meshesToRemove.includes(child.name)) {
        console.log('Found mesh:', child.name);
        
        clickableObjects.push(child);
        
        // Make material visible and set up
        if (!child.material) {
          child.material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            metalness: 0.3,
            roughness: 0.7
          });
        }
        child.material.transparent = true;
        child.material.opacity = 1.0;
        child.material.side = THREE.DoubleSide;
        child.visible = true;

        // ALL meshes become tunnel/planet objects
        tunnelMeshes.push(child);
        
        // Random distribution in 3D tunnel space
        const angle = Math.random() * Math.PI * 2;
        const radius = 3 + Math.random() * 7;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        const z = -Math.random() * 100;
        
        child.userData.tunnel = {
          x: x,
          y: y,
          z: z,
          speed: 0.15 + Math.random() * 0.2,
          rotationSpeedX: (Math.random() - 0.5) * 0.02,
          rotationSpeedY: (Math.random() - 0.5) * 0.02,
          rotationSpeedZ: (Math.random() - 0.5) * 0.02,
          scale: 0.3 + Math.random() * 0.7,
          orbitAngle: angle,
          orbitRadius: radius,
          orbitSpeed: (Math.random() - 0.5) * 0.005
        };
        
        child.position.set(x, y, z);
        child.scale.setScalar(child.userData.tunnel.scale);

        // Add to hoverable if it has audio
        if (audioMeshNames.includes(child.name)) {
          hoverableObjects.push(child);
          console.log('Audio mesh found:', child.name);
        }
        
        meshIndex++;
      }
    });

    scene.add(model);
    console.log('Model loaded successfully, total meshes:', meshIndex);
    console.log('Clickable meshes:', clickableObjects.length);
    console.log('Hoverable (audio) meshes:', hoverableObjects.length);
  }, undefined, function(error) {
    console.log('Model failed to load:', error);
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);
    console.log('Added test cube instead');
  });

  // --- RAYCASTING + AUDIO ---
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function playFrom(startTime) {
    if (!audioBufferShared) return;
    if (currentSource) currentSource.stop();
    const audioCtx = listener.context;
    const source = audioCtx.createBufferSource();
    source.buffer = audioBufferShared;
    source.connect(listener.getInput());
    source.start(0, startTime);
    currentSource = source;
  }

  function onClick(event) {
    mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
    mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects, true);
    if (intersects.length > 0) {
      const clicked = intersects[0].object;
      if (clicked.material && clicked.material.opacity !== undefined) {
        clicked.material.opacity = 0.6;
        setTimeout(() => clicked.material.opacity = 1, 300);
      }
      const segmentStart = audioSegments[clicked.name];
      if (segmentStart !== undefined) playFrom(segmentStart);
    }
  }

  function onMouseMove(event) {
    mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
    mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(hoverableObjects, true);

    if (intersects.length > 0) {
      const hovered = intersects[0].object;
      if (INTERSECTED !== hovered) {
        if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
        INTERSECTED = hovered;
        if (!INTERSECTED.originalColor) INTERSECTED.originalColor = INTERSECTED.material.color.clone();
        INTERSECTED.targetColor = new THREE.Color(hoverColorMap[INTERSECTED.name] || 0xffff00);
      }
    } else {
      if (INTERSECTED) INTERSECTED.targetColor = INTERSECTED.originalColor;
      INTERSECTED = null;
    }
  }

  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("click", onClick);

  // --- RESIZE HANDLER ---
  window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  // --- ANIMATE LOOP ---
  function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // All meshes move through the tunnel like planets
    tunnelMeshes.forEach(mesh => {
      const t = mesh.userData.tunnel;
      
      // Move forward (toward camera)
      mesh.position.z += t.speed;
      
      // Add subtle orbital motion
      t.orbitAngle += t.orbitSpeed;
      const orbitX = Math.cos(t.orbitAngle) * t.orbitRadius;
      const orbitY = Math.sin(t.orbitAngle) * t.orbitRadius;
      
      mesh.position.x = orbitX;
      mesh.position.y = orbitY;
      
      // Reset when mesh passes camera
      if (mesh.position.z > 10) {
        mesh.position.z = -100 - Math.random() * 50;
        
        const newAngle = Math.random() * Math.PI * 2;
        const newRadius = 3 + Math.random() * 7;
        t.orbitAngle = newAngle;
        t.orbitRadius = newRadius;
        t.x = Math.cos(newAngle) * newRadius;
        t.y = Math.sin(newAngle) * newRadius;
        
        mesh.scale.setScalar(0.3 + Math.random() * 0.7);
      }
      
      // Rotate like spinning planets
      mesh.rotation.x += t.rotationSpeedX;
      mesh.rotation.y += t.rotationSpeedY;
      mesh.rotation.z += t.rotationSpeedZ;
    });

    hoverableObjects.forEach(obj => {
      if (obj.material?.color && obj.targetColor) {
        obj.material.color.lerp(obj.targetColor, 0.1);
      }
    });

    renderer.render(scene, camera);
  }
  animate();
  console.log('Animation loop started');
</script>

<script>
const space = document.querySelector('.space-bg');
const numStars = 200;

for (let i = 0; i < numStars; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  star.style.top = `${Math.random() * 100}%`;
  star.style.left = `${Math.random() * 100}%`;

  const size = Math.random() * 2 + 1;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;

  star.style.animationDelay = `${Math.random() * 5}s`;
  star.style.animationDuration = `${2 + Math.random() * 3}s`;

  space.appendChild(star);
}
</script>

</body>
</html>
