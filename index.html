<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monument Mashup</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; z-index: 5;}

    .space-bg {
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #c9e4f7 0%, #1a2a4a 100%);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .clouds-overlay {
      z-index: 10;
      opacity: .3;
      filter: blur(20px);
      pointer-events: none;
      object-fit: cover;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    #scene-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="space-bg"></div>

<div id="scene-layer"></div>

<img class="clouds-overlay" src="cloudtop.gif" onerror="this.style.display='none'">

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>

 <script>
// --- RENDERER TRANSPARENT ---
const container = document.getElementById('scene-layer');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0); // transparent background
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

// --- RESIZE HANDLER ---
window.addEventListener("resize", function () {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// --- PLANET-LIKE VORTEX SETUP ---
const vortexMeshes = []; // meshes that will fly through
const vortexLabels = ["Hilmi","Anon","Henry","Sabir","Shemi","Hannah","Evodie","Marvin","Jessica","Rachid","Jermaine","Dominic"];
const vortexParams = []; // store position/velocity/scale for each mesh

// --- AFTER GLTF LOAD ---
loader.load('model/modelfull2.gltf', function(gltf) {
  const model = gltf.scene;
  model.scale.set(0.026, 0.026, 0.026);
  model.position.y -= 2.5;

  const meshesToRemove = ["Mesh040", "Final_Model_bottom_to_building"];
  const toRemove = [];

  model.traverse((child) => {
    if (meshesToRemove.includes(child.name)) toRemove.push(child);
  });

  toRemove.forEach((mesh) => {
    mesh.traverse((descendant) => {
      if (descendant.isMesh) {
        descendant.geometry.dispose();
        if (descendant.material) {
          if (Array.isArray(descendant.material)) {
            descendant.material.forEach((m) => m.dispose());
          } else {
            descendant.material.dispose();
          }
        }
      }
    });
    if (mesh.parent) mesh.parent.remove(mesh);
  });

  // Populate clickable, hoverable, and vortex objects
  model.traverse((child) => {
    if (child.isMesh && !meshesToRemove.includes(child.name)) {
      clickableObjects.push(child);
      child.material.transparent = true;

      if (Object.keys(hoverColorMap).includes(child.name)) {
        hoverableObjects.push(child);
      }

      if (vortexLabels.includes(child.name)) {
        vortexMeshes.push(child);

        // Initialize position near center with random direction
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 0.5 + 0.1;
        const speed = 0.002 + Math.random() * 0.004;

        vortexParams.push({
          angle,
          radius: distance,
          speed,
          scale: child.scale.x
        });

        // Start near center
        child.position.set(Math.cos(angle) * distance, Math.sin(angle) * distance, 0);
      }
    }
  });

  scene.add(model);
  if (loadingText) loadingText.remove();
});

// --- ANIMATE LOOP WITH VORTEX ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Update hover colors
  hoverableObjects.forEach((obj) => {
    if (obj.material && obj.material.color && obj.targetColor) {
      obj.material.color.lerp(obj.targetColor, 0.1);
    }
  });

  // Update vortex meshes
  vortexMeshes.forEach((mesh, i) => {
    const params = vortexParams[i];

    // Move outward
    params.radius += params.speed;

    // Apply position
    mesh.position.x = Math.cos(params.angle) * params.radius;
    mesh.position.y = Math.sin(params.angle) * params.radius;

    // Scale up as it moves outward
    mesh.scale.set(params.scale * (1 + params.radius * 2), params.scale * (1 + params.radius * 2), params.scale * (1 + params.radius * 2));

    // Reset if too far
    if (params.radius > 2.5) {
      params.radius = 0;
      params.angle = Math.random() * Math.PI * 2;
    }
  });

  renderer.render(scene, camera);
}
animate();

</script>

<script>
const space = document.querySelector('.space-bg');
const numStars = 200;

for (let i = 0; i < numStars; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  star.style.top = `${Math.random() * 100}%`;
  star.style.left = `${Math.random() * 100}%`;

  const size = Math.random() * 2 + 1;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;

  star.style.animationDelay = `${Math.random() * 5}s`;
  star.style.animationDuration = `${2 + Math.random() * 3}s`;

  space.appendChild(star);
}
</script>

</body>
</html>
